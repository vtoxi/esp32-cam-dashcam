<app-page-header title="Live Activity" subtitle="Real-time event stream — every heartbeat, telemetry, incident, evidence upload, command, and webhook delivery as it happens." icon="bolt">
  <div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-200/60 border border-white/5 text-xs">
    <span
      class="w-1.5 h-1.5 rounded-full"
      [class.bg-emerald-400]="stream.connected()"
      [class.animate-pulse-fast]="stream.connected()"
      [class.bg-amber-400]="!stream.connected()"
    ></span>
    <span class="text-slate-300">{{ stream.connected() ? 'Connected' : 'Reconnecting…' }}</span>
  </div>
  <button
    type="button"
    class="focus-ring flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm font-medium border border-white/10 text-slate-300 hover:bg-white/5"
    (click)="clearActivity()"
  >
    <app-icon name="trash" class="w-4 h-4" />
    Clear
  </button>
</app-page-header>

<div class="flex items-center gap-2 flex-wrap mb-5">
  <button
    type="button"
    class="px-3 py-1 rounded-full text-xs font-medium border transition-colors"
    [class]="activeFilters().size === 0 ? 'bg-brand-500/20 border-brand-500/40 text-brand-300' : 'border-white/10 text-slate-400 hover:bg-white/5'"
    (click)="clearFilters()"
  >
    All
  </button>
  @for (type of knownTypes; track type) {
    <button
      type="button"
      class="px-3 py-1 rounded-full text-xs font-mono border transition-colors"
      [class]="activeFilters().has(type) ? 'bg-brand-500/20 border-brand-500/40 text-brand-300' : 'border-white/10 text-slate-400 hover:bg-white/5'"
      (click)="toggleFilter(type)"
    >
      {{ type }}
    </button>
  }
</div>

<div class="rounded-2xl border border-white/5 bg-surface-400/60 p-5 shadow-panel">
  @if (filtered().length === 0) {
    <app-empty-state icon="bolt" message="No activity yet." hint="Events appear here the instant the backend publishes them — trigger a heartbeat/telemetry/incident to see one." />
  } @else {
    <div class="flex flex-col divide-y divide-white/5 max-h-[70vh] overflow-y-auto">
      @for (item of filtered(); track item.id) {
        <div class="flex items-start gap-4 py-3">
          <span class="text-xs text-slate-500 w-16 shrink-0 pt-0.5 tabular-nums" [title]="item.timestamp">{{ item.timestamp | relativeTime }}</span>
          <app-status-badge [value]="item.type" tone="info" class="shrink-0" />
          <a [routerLink]="['/devices', item.deviceId]" class="text-xs font-mono text-slate-400 hover:text-brand-300 shrink-0 w-28 truncate">{{ item.deviceId }}</a>
          <div class="flex-1 min-w-0">
            <app-json-viewer [data]="item.payload" />
          </div>
        </div>
      }
    </div>
  }
</div>
