; CarSentinel firmware — two boards, one generic codebase.
; The shared logic lives in lib/CarSentinelCommon/ (device identity, persistent
; versioned config, watchdog, diagnostics, logging). Each environment compiles only its
; own entry point (src/gateway_main.cpp or src/node_main.cpp) via build_src_filter, so
; hardware-specific main() code never leaks into the other target.

[platformio]
default_envs = gateway, node

[env]
framework = arduino
platform = espressif32
lib_deps =
    bblanchon/ArduinoJson@^7
    h2zero/NimBLE-Arduino@^1.4.3
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    mikalhart/TinyGPSPlus@^1.0.3
monitor_speed = 115200
build_flags =
    -D CARSENTINEL_FIRMWARE_VERSION=\"0.14.0-phase14\"
    ; BLEProvisioning.cpp only ever acts as a NimBLE peripheral/server (advertises,
    ; never scans or connects as a client) — disabling the unused central/observer
    ; roles trims real code (client + scan support) that classic ESP32's tight IRAM
    ; budget can't otherwise afford once Phase 14's OTA (HTTPClient/Update, which
    ; needs IRAM-resident flash-write code) is linked in.
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0
    -D CONFIG_BT_NIMBLE_LOG_LEVEL=1
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:gateway]
; Board confirmed from physical inspection (docs/wiring/ESP32_S3_GATEWAY.md): generic
; ESP32-S3-N16R8 (16MB flash / 8MB octal PSRAM). esp32-s3-devkitc-1 is the closest stock
; PlatformIO board id, but its default board JSON describes the N8 variant (8MB flash,
; no PSRAM) — the overrides below correct flash size/partitions/PSRAM mode to match the
; actual N16R8 chip (same override set used by PlatformIO's own N16R8 board defs, e.g.
; 4d_systems_esp32s3_gen4_r8n16.json). Pin assignments are project-defined (see
; docs/wiring/), not taken from this board id's default map.
board = esp32-s3-devkitc-1
; Adafruit SSD1306/GFX are declared here (not in the global [env] lib_deps) because
; PlatformIO force-links explicitly declared lib_deps into every environment
; regardless of #include usage — unlike project-local lib/ folders, which its
; Library Dependency Finder only pulls in per environment when actually
; #included. DisplayManager (gateway-only, lib/CarSentinelGateway/) is the only
; consumer; keeping these gateway-scoped was the fix for the node build's real
; IRAM overflow (Phase 14) — the node never used OLED code at all.
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
board_build.partitions = default_16MB.csv
build_src_filter = +<gateway_main.cpp> -<node_main.cpp>
build_flags =
    ${env.build_flags}
    -D CARSENTINEL_ROLE_GATEWAY
    -D BOARD_HAS_PSRAM

[env:node]
; AI-Thinker ESP32-CAM (docs/wiring/ESP32_CAM.md).
board = esp32cam
; The "esp32cam" board's default partition table (huge_app.csv) has only ONE app
; partition — standard Arduino OTA (Update.h) requires two (ota_0/ota_1) to write the
; new image into the inactive slot and flip the boot pointer, so it is physically
; impossible on huge_app.csv regardless of application code (Phase 14). min_spiffs.csv
; gives each OTA slot ~1.92MB (current build is ~1.34MB, comfortable headroom) and a
; small 128KB data partition — plenty for the JSON configs LittleFS holds; evidence
; images go to the SD card (SD_MMC), not LittleFS, so the small data partition doesn't
; constrain that.
board_build.partitions = min_spiffs.csv
build_src_filter = +<node_main.cpp> -<gateway_main.cpp>
build_unflags = -fno-lto
build_flags =
    ${env.build_flags}
    -D CARSENTINEL_ROLE_NODE
    -flto
    -fipa-icf
; No onboard USB-serial and no DTR/RTS auto-reset wiring on this adapter (confirmed) —
; a lower, more conservative upload speed reduces "Invalid head of packet" / serial
; noise failures on basic CH340 adapters over the flying-lead connection this board uses.
upload_speed = 115200
