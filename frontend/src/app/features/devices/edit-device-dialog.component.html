<app-dialog-shell title="Edit device" maxWidthClass="max-w-md" (dismiss)="dialogRef.close(false)">
  <p class="text-xs text-slate-500 mb-4 font-mono">{{ device.id }}</p>
  <p class="text-xs text-slate-500 mb-4">
    Only Tenant ID is editable here — hardware profile, firmware version, and node ID are reported by the device
    itself and get overwritten on its next heartbeat.
  </p>

  <label class="block text-xs font-medium text-slate-400 mb-1.5">Tenant ID</label>
  <input
    type="text"
    class="focus-ring w-full rounded-lg border border-white/10 bg-surface-200/60 px-3 py-2 text-sm text-slate-200 font-mono"
    [(ngModel)]="tenantId"
    placeholder="(none)"
  />

  <div class="flex items-center justify-end gap-2 mt-6">
    <button type="button" class="focus-ring px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-white/5" (click)="dialogRef.close(false)">
      Cancel
    </button>
    <button
      type="button"
      class="focus-ring flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold bg-brand-600 hover:bg-brand-500 text-white disabled:opacity-50"
      [disabled]="submitting()"
      (click)="submit()"
    >
      @if (submitting()) {
        <span class="w-3.5 h-3.5 rounded-full border-2 border-white/30 border-t-white animate-spin"></span>
      }
      Save
    </button>
  </div>
</app-dialog-shell>
