<app-dialog-shell title="Delivery history" maxWidthClass="max-w-xl" (dismiss)="dialogRef.close()">
  <p class="text-xs text-slate-500 mb-4 font-mono truncate">{{ url }}</p>

  @if (loading()) {
    <div class="flex justify-center py-10">
      <div class="w-6 h-6 rounded-full border-2 border-brand-400/30 border-t-brand-400 animate-spin"></div>
    </div>
  } @else if (deliveries().length === 0) {
    <app-empty-state icon="link" message="No delivery attempts logged yet." hint="An attempt is logged the moment a matching event is published." />
  } @else {
    <div class="max-h-96 overflow-y-auto flex flex-col gap-2">
      @for (d of deliveries(); track d.id) {
        <div class="flex items-center justify-between gap-3 rounded-lg border border-white/5 bg-surface-200/50 px-3.5 py-2.5 text-sm">
          <div class="flex flex-col">
            <span class="text-slate-200 font-mono text-xs">{{ d.eventType }}</span>
            <span class="text-slate-500 text-xs" [title]="d.attemptedAt">{{ d.attemptedAt | relativeTime }}</span>
          </div>
          <div class="flex items-center gap-2">
            @if (d.statusCode) {
              <span class="text-xs text-slate-400 font-mono">HTTP {{ d.statusCode }}</span>
            }
            <app-status-badge [value]="d.success ? 'success' : 'failed'" />
          </div>
        </div>
      }
    </div>
  }

  <div class="flex justify-end mt-6">
    <button type="button" class="focus-ring px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:bg-white/5" (click)="dialogRef.close()">
      Close
    </button>
  </div>
</app-dialog-shell>
